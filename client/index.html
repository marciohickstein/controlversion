<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Controle de Versão</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="https://imobiliar.com.br/wp-content/uploads/2024/11/Logo-Imobiliar.svg" alt="Imobiliar Logo">
            </div>
            <h1 class="login-title">Bem-vindo</h1>
            <p class="login-subtitle">Acesse o painel de controle de versão</p>

            <form id="loginForm" onsubmit="return false;">
                <div class="form-group">
                    <label for="user">Usuário</label>
                    <input type="text" id="user" class="form-control" placeholder="Digite seu usuário" required>
                </div>
                <div class="form-group">
                    <label for="passwd">Senha</label>
                    <input type="password" id="passwd" class="form-control" placeholder="Digite sua senha" required>
                </div>
                <div class="form-group">
                    <button type="button" onclick="login()" class="btn btn-primary btn-block">
                        Entrar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="node_modules/jquery/dist/jquery.min.js"></script>
    <script>
        function login() {
            let user = document.getElementById('user').value;
            let passwd = document.getElementById('passwd').value;
            let url = window.location.origin;

            if (!user || !passwd) {
                alert('Por favor, preencha todos os campos.');
                return;
            }

            fetch(`${url}/login`, {
                method: "POST",
                body: JSON.stringify({user: user, passwd: passwd}),
                headers: {
                    "Content-type": "application/json; charset=UTF-8"
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.auth) {
                    sessionStorage.setItem("token", data.token);
                    window.location.replace(`${window.location.origin}/panel.html`);
                } else {
                    alert(data.error);
                }
            })
            .catch(err => {
                alert('Erro ao conectar com o servidor.');
                console.error(err);
            });
        }

        document.getElementById('user').addEventListener('keypress', function(event) {
            if (event.keyCode === 13) {
                login();
            }
        });

        document.getElementById('passwd').addEventListener('keypress', function(event) {
            if (event.keyCode === 13) {
                login();
            }
        });
    </script>
</body>
</html>
