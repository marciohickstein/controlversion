<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Geração de Versão</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
    <meta name="theme-color" content="#2940D6">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
    <!-- Header -->
    <header class="panel-header">
        <div class="header-content">
            <h1 class="header-title">Controle de Versão</h1>
            <div class="header-actions">
                <div class="header-logo">
                    <img src="https://imobiliar.com.br/wp-content/uploads/2024/11/Logo-Imobiliar.svg" alt="Imobiliar Logo">
                </div>
                <button id="btn-logout" class="btn btn-logout" onclick="logout()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Sair
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="panel-container">
        <!-- Abas principais -->
        <nav class="panel-tabs">
            <button type="button" class="panel-tab active" data-section="sec-status">Status do Repositório</button>
            <button type="button" class="panel-tab" data-section="sec-warn">Aviso Geral</button>
            <button type="button" class="panel-tab" data-section="sec-connect">Teste de Conexão</button>
            <button type="button" class="panel-tab" data-section="sec-logs">Versão</button>
        </nav>

        <!-- Repository Status Card -->
        <div class="card panel-section active" id="sec-status">
            <h2 class="card-title">Status do Repositório</h2>
            <div class="form-row">
                <div class="form-group-inline" style="flex: 2;">
                    <label>Status Atual</label>
                    <div id="status" class="status-badge">Carregando...</div>
                </div>
                <div class="form-group-inline" style="flex: 0; min-width: auto;">
                    <label>Bloqueio</label>
                    <label class="custom-switch" id="btn-toggle">
                        <input type="checkbox" id="switch1">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Warning Card -->
        <div class="card panel-section" id="sec-warn">
            <h2 class="card-title">Aviso Geral</h2>
            <div class="form-row">
                <div class="form-group-inline">
                    <label for="dtDateIni">Data Início</label>
                    <input type="text" id="dtDateIni" name="dtDateIni" class="form-control datetime-picker" placeholder="dd/mm/aaaa hh:mm">
                </div>
                <div class="form-group-inline">
                    <label for="dtDateEnd">Data Fim</label>
                    <input type="text" id="dtDateEnd" name="dtDateEnd" class="form-control datetime-picker" placeholder="dd/mm/aaaa hh:mm">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group-inline">
                    <label for="text-warn">Mensagem do Aviso</label>
                    <textarea id="text-warn" class="form-control" rows="3" placeholder="Digite a mensagem do aviso..."></textarea>
                </div>
            </div>
            <div class="form-actions">
                <button id="btn-warn" class="btn btn-primary">Gerar Aviso</button>
            </div>
        </div>

        <!-- Connection Test Card -->
        <div class="card panel-section" id="sec-connect">
            <h2 class="card-title">Teste de Conexão</h2>
            <div class="form-row">
                <div class="form-group-inline" style="flex: 2;">
                    <label for="inputHost">Endereço</label>
                    <input type="text" id="inputHost" name="inputHost" class="form-control" placeholder="192.168.0.1">
                </div>
                <div class="form-group-inline">
                    <label for="inputPort">Porta</label>
                    <input type="number" id="inputPort" name="inputPort" class="form-control" placeholder="22">
                </div>
            </div>
            <div class="form-actions">
                <button id="btn-connect" class="btn btn-primary">Testar Conexão</button>
            </div>
        </div>

        <!-- Execute Command Card -->
        <!-- <div class="card">
            <h2 class="card-title">Executar Comando</h2>
            <div class="form-row">
                <div class="form-group-inline">
                    <label for="inputExecHost">Endereço</label>
                    <input type="text" id="inputExecHost" name="inputExecHost" class="form-control" placeholder="192.168.0.1">
                </div>
                <div class="form-group-inline" style="flex: 0.5;">
                    <label for="inputExecPort">Porta</label>
                    <input type="number" id="inputExecPort" name="inputExecPort" class="form-control" placeholder="22">
                </div>
                <div class="form-group-inline" style="flex: 1.5;">
                    <label for="selectCommand">Comando</label>
                    <select id="selectCommand" class="form-control">
                        <option value="update">Atualizar Imobiliar</option>
                        <option value="blockupt">Bloquear Atualização</option>
                        <option value="unblockupt">Desbloquear Atualização</option>
                        <option value="setreadonly">Ativar Modo Consulta</option>
                        <option value="unsetreadonly">Desativar Modo Consulta</option>
                        <option value="chkreadonly">Modo Consulta Ativo?</option>
                        <option value="chkblockupt">Atualização Habilitada?</option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button id="btn-execute" class="btn btn-primary">Executar</button>
            </div>
        </div> -->

        <!-- Logs Card -->
        <div class="card panel-section" id="sec-logs">
            <h2 class="card-title">Histórico de Alterações no Imobiliar</h2>
            <div class="form-row" style="margin-bottom: 20px;">
                <div class="form-group-inline" style="flex: 0; min-width: 200px;">
                    <label for="target">Ambiente</label>
                    <select id="target" class="form-control">
                        <option value="prod">Produção</option>
                        <option value="desenv">Desenvolvimento</option>
                    </select>
                </div>
                <div class="form-group-inline" style="flex: 1; display: flex; align-items: flex-end;">
                    <a id="link-changelog" class="changelog-link" href="http://www.inetsoft.com.br/area-cliente/bugs_newfeatures.html" target="_blank" rel="noopener noreferrer">
                        Ver Correções
                    </a>
                </div>
            </div>

            <!-- Tabs -->
            <div class="nav-tabs-custom">
                <a href="#log1" id="nav1" class="nav-link active" data-toggle="tab">Servidor</a>
                <a href="#log2" id="nav2" class="nav-link" data-toggle="tab">Cliente</a>
                <a href="#log3" id="nav3" class="nav-link" data-toggle="tab">Web</a>
                <a href="#log4" id="nav4" class="nav-link" data-toggle="tab">Publicação</a>
            </div>

            <div class="tab-content">
                <div class="tab-pane active" id="log1"></div>
                <div class="tab-pane" id="log2" style="display: none;"></div>
                <div class="tab-pane" id="log3" style="display: none;"></div>
                <div class="tab-pane" id="log4" style="display: none;"></div>
            </div>
        </div>
    </main>

    <script src="/vendor/jquery/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>
    <script>
        // Initialize Brazilian datetime pickers
        flatpickr(".datetime-picker", {
            enableTime: true,
            dateFormat: "d/m/Y H:i",
            time_24hr: true,
            locale: "pt"
        });

        // Logout function
        function logout() {
            sessionStorage.removeItem("token");
            window.location.replace(window.location.origin);
        }

        // Check authentication
        if (!sessionStorage.getItem("token")) {
            window.location.replace(window.location.origin);
        }

        // Troca das abas principais do painel
        document.querySelectorAll('.panel-tab').forEach(tab => {
            tab.addEventListener('click', function () {
                document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel-section').forEach(s => s.classList.remove('active'));

                this.classList.add('active');
                document.getElementById(this.dataset.section).classList.add('active');
            });
        });

        // Tab functionality
        document.querySelectorAll('.nav-tabs-custom .nav-link').forEach(tab => {
            tab.addEventListener('click', function(e) {
                e.preventDefault();

                // Remove active from all tabs
                document.querySelectorAll('.nav-tabs-custom .nav-link').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-pane').forEach(p => {
                    p.classList.remove('active');
                    p.style.display = 'none';
                });

                // Add active to clicked tab
                this.classList.add('active');
                const targetId = this.getAttribute('href').substring(1);
                const targetPane = document.getElementById(targetId);
                targetPane.classList.add('active');
                targetPane.style.display = 'block';
            });
        });
    </script>
    <script src="assets/js/script.js"></script>
</body>
</html>
